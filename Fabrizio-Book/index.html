<style>
  :root{--black:#0a0a0b;--offwhite:#f2f0ed;--purple:#7c5cfc;--purple-light:#9b80ff;
    --muted:rgba(242,240,237,.55);--line:rgba(242,240,237,.14);--g1:#141416;
    --sans:'Outfit',sans-serif;--serif:'Cormorant Garamond',Georgia,serif;--mono:'JetBrains Mono',monospace;}
  *{box-sizing:border-box;}
  body{margin:0;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:2rem;
    background:var(--black);color:var(--offwhite);font-family:var(--sans);font-weight:300;-webkit-font-smoothing:antialiased;}
  .glow{position:fixed;top:-20%;left:50%;transform:translateX(-50%);width:900px;height:600px;max-width:120vw;
    background:radial-gradient(ellipse at center,rgba(124,92,252,.12),transparent 70%);pointer-events:none;}
  .card{position:relative;width:100%;max-width:400px;text-align:center;}
  .wordmark{font-family:var(--sans);font-weight:600;font-size:26px;letter-spacing:-.02em;margin:0 0 .4rem;}
  .wordmark .p{color:var(--purple);}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--purple-light);margin:0 0 2.2rem;}
  h1{font-family:var(--serif);font-style:italic;font-weight:500;font-size:24px;margin:0 0 .6rem;}
  .sub{color:var(--muted);font-size:14px;margin:0 0 2rem;}
  form{display:flex;flex-direction:column;gap:.8rem;}
  input{font-family:var(--sans);font-size:15px;color:var(--offwhite);text-align:center;
    background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:999px;padding:.95em 1.4em;}
  input::placeholder{color:var(--muted);}
  input:focus{outline:none;border-color:var(--purple);}
  button{font-family:var(--sans);font-weight:500;font-size:15px;color:#fafafa;cursor:pointer;
    background:var(--purple);border:1px solid var(--purple);border-radius:999px;padding:.95em 1.4em;
    transition:transform .3s cubic-bezier(.16,1,.3,1),background .3s;}
  button:hover{background:var(--purple-light);}
  button:active{transform:scale(.975);}
  .err{min-height:1.2em;font-family:var(--mono);font-size:11px;letter-spacing:.04em;color:#e0846a;margin-top:.4rem;}
  .note{margin-top:2.4rem;font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);}
  .shake{animation:shake .4s;}
  @keyframes shake{10%,90%{transform:translateX(-1px);}30%,70%{transform:translateX(3px);}50%{transform:translateX(-3px);}}
  @media (prefers-reduced-motion:reduce){.shake{animation:none;}button{transition:none;}}
</style>
</head>
<body>
<div class="glow" aria-hidden="true"></div>
<main class="card">
  <p class="wordmark">jgmetzger<span class="p">.</span></p>
  <p class="eyebrow">Confidential proposal</p>
  <h1>This proposal is private.</h1>
  <p class="sub">Enter the password you were given to view it.</p>
  <form id="g" autocomplete="off">
    <label for="pw" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);">Password</label>
    <input type="password" id="pw" placeholder="Password" autocomplete="current-password" aria-describedby="err" />
    <button type="submit">Unlock proposal</button>
    <p class="err" id="err" role="alert" aria-live="polite"></p>
  </form>
  <p class="note">jgmetzger. — by invitation</p>
</main>
